<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CISS - Mission Comparison & Archive</title>
    <link rel="icon" type="image/png" href="CISS.png">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #020408;
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid #30363d;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        header h1 {
            color: #58a6ff;
            margin: 0 0 8px 0;
            font-size: 1.5rem;
        }
        header p {
            color: #8b949e;
            margin: 0;
            font-size: 0.85rem;
        }
        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .nav-back:hover {
            background: #30363d;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            overflow: hidden;
            font-size: 0.85rem;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #21262d;
        }
        th {
            background: #161b22;
            color: #58a6ff;
            letter-spacing: 1px;
        }
        tr:hover {
            background: rgba(88, 166, 255, 0.03);
        }
        .report-btn {
            background: #1f6feb;
            border: 1px solid #388bfd;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .report-btn:hover {
            background: #388bfd;
        }
        .no-data {
            text-align: center;
            color: #8b949e;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">&larr; RETURN TO FLIGHT DECK</a>

        <header>
            <h1>MISSION ARCHIVE & COMPARISON MATRIX</h1>
            <p id="pilot-subtitle">PAST FLIGHT TELEMETRY & SYSTEM BLUEPRINTS</p>
        </header>

        <table id="compare-table">
            <thead>
                <tr>
                    <th>TIMESTAMP</th>
                    <th>TARGET</th>
                    <th>TIER</th>
                    <th>LAUNCHER / ROUTE</th>
                    <th>SYSTEMS (PWR/COMM/INST)</th>
                    <th>SCORE</th>
                    <th>GRADE</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="compare-tbody">
                <tr><td colspan="8" class="no-data">Loading mission archives...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Parse player callsign from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const playerCallsign = urlParams.get('player') ? urlParams.get('player').trim() : 'Commander';
        
        document.getElementById('pilot-subtitle').innerText = `PAST FLIGHT TELEMETRY & BLUEPRINTS FOR: ${playerCallsign.toUpperCase()}`;

        function loadMissionArchive() {
            const storageKey = `saved_missions_${playerCallsign.toLowerCase()}`;
            const savedMissions = JSON.parse(localStorage.getItem(storageKey) || '[]');
            const tbody = document.getElementById('compare-tbody');

            if (savedMissions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="no-data">No archived missions found for "${playerCallsign}". Complete a simulation run first!</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            // Render missions in reverse chronological order (newest first)
            savedMissions.slice().reverse().forEach((mission, index) => {
                const row = document.createElement('tr');
                
                let gradeColor = mission.grade === 'S' ? '#58a6ff' : (mission.grade === 'A' ? '#2ea043' : (mission.grade === 'B' ? '#f0883e' : '#f85149'));

                row.innerHTML = `
                    <td>${mission.timestamp || 'N/A'}</td>
                    <td><strong>${mission.target || 'Europa'}</strong></td>
                    <td>${mission.difficulty || 'Commander'}</td>
                    <td>${mission.launcher || 'FalconHeavy'}<br><span style="font-size:0.75rem; color:#8b949e;">${mission.route || 'Direct'}</span></td>
                    <td><span style="font-size:0.75rem; color:#8b949e;">P: ${mission.power || 'Solar'}<br>C: ${mission.comm || 'HGA'}<br>I: ${mission.instrument || 'Camera'}</span></td>
                    <td><strong>${mission.score || 0} PTS</strong></td>
                    <td><strong style="color: ${gradeColor};">${mission.grade || 'F'}</strong></td>
                    <td><button class="report-btn" onclick='openArchivedReport(${JSON.stringify(mission)})'>📄 REPORT</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        // Dedicated Mission Report generator for historical items in the compare page
        function openArchivedReport(mission) {
            const reportWindow = window.open('', '_blank');
            if (!reportWindow) {
                alert("⚠️ Popup blocked! Please allow popups for this site to view the Mission Report.");
                return;
            }

            const rawSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#0d1117" stroke="#58a6ff" stroke-width="8"/><circle cx="50" cy="50" r="25" fill="none" stroke="#f85149" stroke-width="6"/><line x1="50" y1="5" x2="50" y2="95" stroke="#58a6ff" stroke-width="4"/><line x1="5" y1="50" x2="95" y2="50" stroke="#58a6ff" stroke-width="4"/><circle cx="50" cy="50" r="8" fill="#58a6ff"/></svg>`;
            const cissFaviconSvg = `data:image/svg+xml,${encodeURIComponent(rawSvg)}`;
            const isFail = mission.grade === 'F' || mission.grade === 'C' || parseInt(mission.score) === 0;

            reportWindow.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>CISS - Archived Mission Report (${playerCallsign})</title>
                    <link rel="icon" type="image/svg+xml" href="${cissFaviconSvg}">
                    <style>
                        body {
                            background-color: #0d1117;
                            color: #c9d1d9;
                            font-family: 'Courier New', Courier, monospace;
                            padding: 40px;
                            margin: 0;
                        }
                        .report-container {
                            max-width: 750px;
                            margin: auto;
                            background: #161b22;
                            border: 1px solid #30363d;
                            border-radius: 8px;
                            padding: 40px;
                            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
                        }
                        h1 {
                            color: #58a6ff;
                            font-size: 1.5rem;
                            border-bottom: 2px solid #30363d;
                            padding-bottom: 10px;
                            margin-top: 0;
                        }
                        .subtitle {
                            color: #8b949e;
                            font-size: 0.85rem;
                            margin-top: -5px;
                            margin-bottom: 30px;
                        }
                        .grid-2 {
                            display: grid;
                            grid-template-columns: 1fr 1fr;
                            gap: 20px;
                            margin: 20px 0;
                        }
                        .card {
                            background: #0d1117;
                            border: 1px solid #30363d;
                            padding: 20px;
                            border-radius: 6px;
                        }
                        .analysis-card {
                            background: #0d1117;
                            border: 1px solid ${isFail ? '#f85149' : '#238636'};
                            padding: 20px;
                            border-radius: 6px;
                            margin-top: 25px;
                            font-size: 0.85rem;
                            line-height: 1.6;
                        }
                        .badge {
                            background: ${isFail ? '#f85149' : '#238636'};
                            color: white;
                            padding: 4px 10px;
                            border-radius: 4px;
                            font-weight: bold;
                        }
                        p {
                            line-height: 1.6;
                            margin: 8px 0;
                        }
                        .footer {
                            margin-top: 40px;
                            font-size: 0.75rem;
                            color: #8b949e;
                            text-align: center;
                            border-top: 1px solid #30363d;
                            padding-top: 15px;
                        }
                    </style>
                </head>
                <body>
                    <div class="report-container">
                        <h1>CEYLON INSTITUTE OF SPACE SCIENCE (CISS)</h1>
                        <div class="subtitle">ARCHIVED INTERPLANETARY MISSION REPORT &bull; TIMESTAMP: ${mission.timestamp || 'N/A'}</div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                            <div>
                                <p><strong>PILOT CALLSIGN:</strong> ${playerCallsign}</p>
                                <p><strong>MISSION TIER:</strong> ${mission.difficulty || 'Commander'}</p>
                                <p><strong>TARGET DESTINATION:</strong> ${mission.target}</p>
                            </div>
                            <div style="text-align: right;">
                                <p><strong>MISSION GRADE:</strong> <span class="badge">${mission.grade}</span></p>
                                <p><strong>SCIENCE YIELD:</strong> ${mission.score} PTS</p>
                            </div>
                        </div>

                        <h2 style="color: #2ea043; font-size: 1.1rem; border-bottom: 1px solid #30363d; padding-bottom: 6px; margin-top: 30px;">SPACECRAFT CONFIGURATION & METRICS</h2>
                        <div class="grid-2">
                            <div class="card">
                                <p><strong>Launch Vehicle:</strong> ${mission.launcher}</p>
                                <p><strong>Power Generator:</strong> ${mission.power}</p>
                                <p><strong>Communications:</strong> ${mission.comm}</p>
                            </div>
                            <div class="card">
                                <p><strong>Scientific Instrument:</strong> ${mission.instrument}</p>
                                <p><strong>Flight Route:</strong> ${mission.route}</p>
                                <p><strong>Radiation Shielding:</strong> ${mission.shield}%</p>
                            </div>
                        </div>

                        <div class="analysis-card">
                            <h3 style="color: ${isFail ? '#f85149' : '#2ea043'}; margin-top: 0; font-size: 1rem;">📋 ARCHIVED TELEMETRY ANALYSIS</h3>
                            <p>${isFail ? 'This archived mission run failed to satisfy all primary operational thresholds or encountered critical resource constraints during transit.' : 'This archived mission successfully fulfilled all mission design and data throughput requirements for the selected destination.'}</p>
                        </div>

                        <div class="footer">
                            © 2026 Ceylon Institute of Space Science (CISS) • Retrieved from Mission Comparison Archive
                        </div>
                    </div>
                </body>
                </html>
            `);
            reportWindow.document.close();
        }

        loadMissionArchive();
    </script>
</body>
</html>
